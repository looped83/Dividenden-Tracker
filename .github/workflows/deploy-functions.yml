name: Deploy Edge Functions

# Rollt die Supabase Edge Functions aus, ohne dass lokal eine CLI installiert
# sein muss (DECISIONS.md D-027: die Entwicklungsumgebung hat kein Docker).
#
# Einmalig einzurichten — Repository → Settings → Secrets and variables →
# Actions → New repository secret:
#   SUPABASE_ACCESS_TOKEN  persoenliches Zugriffstoken,
#                          https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    Projekt-Ref aus der Dashboard-Adresse
#                          (https://supabase.com/dashboard/project/<ref>)
#
# Die Feed-Adresse gehoert **nicht** hierher: Sie liegt als Supabase-Secret
# DIVVYDIARY_ICAL_URL im Projekt und wird von der Funktion zur Laufzeit
# gelesen (docs/CALENDAR_INTEGRATION.md).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  # Erlaubt das Ausrollen von Hand — der uebliche Weg beim ersten Mal.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `--use-api` bundelt in der Cloud statt in einem lokalen Docker-Container;
      # der Runner hat keinen. Die Einstellungen der Funktion (u. a.
      # verify_jwt = true) liest die CLI aus supabase/config.toml.
      - name: sync-divvydiary-calendar ausrollen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-divvydiary-calendar \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --use-api
