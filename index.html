<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Content-Security-Policy als Meta-Element: GitHub Pages laesst keine
         eigenen Kopfzeilen zu (SECURITY_MODEL.md §7). `connect-src` nimmt die
         Supabase-Adresse aus der Bauzeit-Variablen auf; ohne sie stuende hier
         eine Erlaubnis fuer irgendeinen Server. Dazu GDELT fuer die News
         (SECURITY_MODEL.md „News“). Nicht abbildbar sind
         `frame-ancestors`, HSTS und `X-Content-Type-Options` — die gehen nur
         als echte Kopfzeile und bleiben offen, solange auf Pages geliefert
         wird. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-/BomtQ72dKF3QBYd6Nb9zaKiXmqpdKXENJHa+PLlEYI='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' %VITE_SUPABASE_URL% https://api.gdeltproject.org; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Dividenden-Tracker: erhaltene Dividenden erfassen, auswerten und mit Zielen vergleichen."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- iOS-Statusleiste der Home-Bildschirm-App. Hell bleibt `default`
         (dunkle Schrift auf eigener Leiste). Dunkel setzt das Skript darunter
         `black-translucent`: Die Seite laeuft unter die Leiste und haelt
         selbst `safe-area-inset-top` frei (AppShell). Mit `default` legte iOS 26
         einen schwarzen Verlauf unter die Leiste, der den Seitenkopf
         anschnitt, und der Abstand zur Uhrzeit war doppelt. Muss vor dem
         Skript stehen, das ihn umstellt. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Dunkles Design vor dem ersten Zeichnen setzen. Ohne dies stand bis zum
         Start von React eine weisse Seite da — auf dem schwarzen Dunkelmodus
         ein greller Blitz bei jedem Oeffnen. Dieselbe Regel wie
         ThemeProvider.readStoredTheme. Inline, damit keine zusaetzliche
         Anfrage den ersten Bildschirm aufhaelt; die CSP erlaubt genau dieses
         Skript ueber seinen Hash (Pruefung: tests/unit/app/themeBootstrap). -->
    <script>
      try {
        var t = localStorage.getItem("dividend-tracker:theme");
        if (
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
          document
            .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
            .setAttribute("content", "black-translucent");
        }
      } catch {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23db5e07'/%3E%3Ctext x='12' y='17' font-size='13' font-family='sans-serif' font-weight='700' fill='%23ffffff' text-anchor='middle'%3E€%3C/text%3E%3C/svg%3E"
    />
    <!-- Installierbar auf dem Home-Bildschirm (PWA): Manifest, Icons und die
         Angaben, die iOS statt des Manifests auswertet. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dividenden" />
    <title>Dividenden-Tracker</title>
    <!-- Startbild bis React uebernimmt. Ohne es blieb die Seite leer, bis rund
         200 kB JavaScript geladen waren — auf einem langsamen Telefon drei
         Sekunden (Lighthouse). Das Bild braucht nur dieses Inline-CSS und
         erscheint, sobald das HTML da ist; der erste Render von React ersetzt
         den Inhalt von #root. Farben wie die Tokens in styles/index.css;
         `.dark` setzt das Skript oben. Keine Animation: Es steht meist nur
         Sekundenbruchteile. -->
    <style>
      .boot {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #fff;
        color: oklch(0.5 0.006 286);
        font:
          500 0.9375rem -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Inter",
          system-ui,
          sans-serif;
      }
      .boot-mark {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 14px;
        background: oklch(0.58 0.168 44);
        color: #fff;
        font-size: 30px;
        font-weight: 700;
      }
      .dark .boot {
        background: #000;
        color: oklch(0.72 0.012 260);
      }
      .dark .boot-mark {
        background: oklch(0.72 0.185 48);
        color: #000;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <span class="boot-mark" aria-hidden="true">€</span>
        Dividenden-Tracker
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
